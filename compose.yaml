services:
  bot:
    build: .
    restart: unless-stopped  # also starts again after a server reboot
    env_file: .env
    environment:
      DB_PATH: /app/data/bot.db
      LOG_FILE: /app/data/bot.log
    volumes:
      - ./data:/app/data  # database + logs live next to the code: easy to back up or move
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
